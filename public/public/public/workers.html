<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Find Workers</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h2>🔎 Find Workers</h2>

<input
id="work"
placeholder="काम - Mason">

<input
id="city"
placeholder="शहर - Lucknow">

<button onclick="searchWorkers()">
Search
</button>

<div id="workers"></div>

</div>

<script>

async function searchWorkers() {

    const token =
        localStorage.getItem("contractorToken");

    if (!token) {

        alert("पहले Contractor Login करें");

        window.location =
            "contractor-login.html";

        return;

    }

    const work =
        document.getElementById(
            "work"
        ).value;

    const city =
        document.getElementById(
            "city"
        ).value;

    const response =
        await fetch(
            `/api/workers?work=${encodeURIComponent(work)}&city=${encodeURIComponent(city)}`,
            {
                headers: {
                    "Authorization":
                    "Bearer " + token
                }
            }
        );

    const workers =
        await response.json();

    const container =
        document.getElementById(
            "workers"
        );

    container.innerHTML = "";

    workers.forEach(worker => {

        container.innerHTML += `

        <div class="worker-card">

            <h3>
                ${worker.name}
            </h3>

            <p>
                Worker ID:
                ${worker.worker_id}
            </p>

            <p>
                काम:
                ${worker.work}
            </p>

            <p>
                शहर:
                ${worker.city}
            </p>

            <p>
                अनुभव:
                ${worker.experience} साल
            </p>

            <p>
                ${worker.description || ""}
            </p>

            <button
            onclick="contactWorker('${worker.phone}')">

                📞 Contact

            </button>

        </div>

        `;

    });

}

function contactWorker(phone) {

    window.location =
        "tel:" + phone;

}

</script>

</body>

</html>
