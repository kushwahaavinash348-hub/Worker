<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Worker Login</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="form-box">

<h2>Worker Login</h2>

<form id="loginForm">

<input
name="worker_id"
placeholder="Worker ID"
required>

<input
name="password"
type="password"
placeholder="Password"
required>

<button>
Login
</button>

</form>

<p id="result"></p>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const data =
        Object.fromEntries(
            new FormData(this)
        );

    const response =
        await fetch(
            "/api/workers/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify(data)
            }
        );

    const result =
        await response.json();

    if (result.token) {

        localStorage.setItem(
            "workerToken",
            result.token
        );

        window.location =
            "worker-dashboard.html";

    } else {

        document
        .getElementById("result")
        .innerText =
            result.message;

    }

});

</script>

</body>

</html>
